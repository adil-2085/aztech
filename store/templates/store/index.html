{% extends 'base.html' %}

{% block content %}
<div>

    <!-- Hero Banner (Edge-to-Edge) -->
    <!-- Mimicking the ASOS editorial style: full-width image, centered bold text, clear CTA -->
    <div class="relative bg-asos-black text-white h-72 sm:h-96 flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-black/20"></div>
        <div class="relative text-center px-4">
            <p class="text-xs sm:text-sm font-bold tracking-[0.3em] uppercase text-gray-200 mb-3">New Season</p>
            <h1 class="text-4xl sm:text-6xl font-black tracking-tighter uppercase">{{ store_settings.brand_name|default:"Loom" }}</h1>
            <a href="#product-grid" class="inline-block mt-6 bg-white text-asos-black text-sm font-bold uppercase tracking-wider px-8 py-3 rounded-full hover:bg-gray-200 transition">Shop Now</a>
        </div>
    </div>

    <!-- Category Filter Chips -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
        <div id="category-filters" class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
            <button data-category="" class="filter-chip active px-5 py-2 rounded-full text-sm font-bold uppercase tracking-wide border border-asos-black bg-asos-black text-white whitespace-nowrap">
                All
            </button>
            <!-- Additional chips are injected by main.js once categories are known from the product payload -->
        </div>
    </div>

    <!-- Product Grid -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8">
            <!-- Skeleton placeholders shown while main.js fetches /api/products/ -->
            {% for _ in "1234" %}
            <div class="animate-pulse">
                <div class="aspect-3-4 bg-gray-200 rounded-md"></div>
                <div class="h-3 bg-gray-200 rounded mt-3 w-3/4"></div>
                <div class="h-3 bg-gray-200 rounded mt-2 w-1/2"></div>
            </div>
            {% endfor %}
        </div>
        <p id="product-grid-empty" class="hidden text-center text-gray-400 py-16">No products found in this category yet.</p>
    </div>

</div>
{% endblock %}
